name: Daily AI News Collector

on:
  schedule:
    # Cron 時間使用 UTC：
    # 23:30 (UTC) = 台灣時間 早上 07:30
    # 04:30 (UTC) = 台灣時間 中午 12:30
    - cron: '30 23 * * *'
    - cron: '30 4 * * *'
  workflow_dispatch: # 仍保留手動按鈕

jobs:
  run-script:
    runs-on: ubuntu-latest
    steps:
      - name: 複製專案程式碼
        uses: actions/checkout@v4

      - name: 設定 Python 環境
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 安裝所需套件
        run: |
          pip install feedparser requests openai

      - name: 執行新聞抓取腳本
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python main.py
